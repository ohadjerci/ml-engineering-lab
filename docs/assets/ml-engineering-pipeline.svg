<text x="412" y="243" fill="#243648" font-size="17" font-weight="400" text-anchor="start">Lockfile · locked install</text>
<text x="412" y="266" fill="#243648" font-size="17" font-weight="400" text-anchor="start">Installed dependency check</text>
