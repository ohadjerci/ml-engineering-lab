[project]
name = "ml-engineering-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy==1.26.4",
    "albumentations==1.4.24",
    "opencv-python-headless==4.10.0.84",
    "imgaug==0.4.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "pytorch-lightning==2.5.0",
    "segmentation-models-pytorch==0.4.0",
    "timm==1.0.15",
    "efficientnet-pytorch==0.7.1",
    "pretrainedmodels==0.7.4",
    "scikit-image==0.25.2",
    "scipy==1.15.2",
    "matplotlib==3.10.1",
    "Pillow==11.1.0",
    "PyWavelets==1.8.0",
    "Shapely==2.0.7",
    "imageio==2.37.0",
    "tensorboard==2.19.0",
    "aiohttp==3.11.14",
    "fsspec==2025.3.0",
    "ruamel.yaml==0.18.10",
    "tifffile==2025.3.13",
    "tqdm==4.67.1",
    "lightning==2.5.0",
    "torchmetrics",
    "pyrootutils",
    "rich==13.9.4",
    "mlflow",
    "hydra-colorlog",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pytest",
    "pytest-cov>=7,<8",
    "sh; sys_platform != 'win32'",
    "hydra-optuna-sweeper==1.2.0",
    # Test helpers still import pkg_resources (removed in setuptools 82).
    "setuptools<81",
]

[tool.uv]
package = false
required-version = ">=0.13.7"
# Deployment target: CUDA containers on Linux x86-64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
addopts = "--cov --cov-config=pyproject.toml --cov-report=term-missing --cov-report=json --cov-report=xml"
pythonpath = ["."]
markers = ["slow: integration tests with short training or sweep runs"]

[tool.coverage.run]
source = ["src"]
branch = true
concurrency = ["multiprocessing", "thread"]
parallel = true
relative_files = true

[tool.coverage.report]
include_namespace_packages = true

[tool.coverage.json]
output = "coverage.json"

[tool.ruff]
target-version = "py312"
line-length = 99
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = [
    "data/**", "logs/**", "outputs/**", "multirun/**", "checkpoints/**", "lightning_logs/**",
    "mlruns/**", "mlartifacts/**", "wandb/**", ".aim/**", ".cache/**", "htmlcov/**", "tmp/**", "temp/**",
    "build/**", "dist/**", "generated/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Expand this list as the legacy detection helpers and cluster plugin are repaired.
files = [
    "src/train.py", "src/eval.py", "src/data", "src/models/mnist_module.py",
    "src/models/components", "src/utils",
]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
exclude = '^(generated|data|logs|outputs|multirun|checkpoints|build|dist|\.cache|\.venv)/'

[[tool.mypy.overrides]]
# torchvision and pyrootutils ship without typing metadata; wandb is optional.
module = ["torchvision.*", "pyrootutils", "wandb.*"]
ignore_missing_imports = true
