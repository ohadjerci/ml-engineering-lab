name: CI

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Python tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      CUDA_VISIBLE_DEVICES: ""
      # Keep the cache beside .venv so large locked CUDA wheels can be hardlinked.
      UV_LINK_MODE: hardlink
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-local-path: ${{ github.workspace }}/.cache/uv
          # Retain downloaded wheels to avoid repeated multi-GB CUDA downloads.
          prune-cache: false

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked dependencies
        id: dependencies
        run: uv sync --locked

      - name: Check installed dependencies
        run: uv pip check

      - name: Test report action
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked python -m unittest discover -s .github/actions/quality-report -p 'test_*.py'

      - name: Run tests without sweeps
        id: tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          uv run --locked pytest --ignore=tests/test_sweeps.py -ra
          --junitxml="$RUNNER_TEMP/pytest-cpu.xml"

      - name: Ruff lint
        id: ruff
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked ruff check . --output-format=json --output-file "$RUNNER_TEMP/ruff.json"

      - name: Ruff formatting
        id: format
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: uv run --locked ruff format --check . 2>&1 | tee "$RUNNER_TEMP/ruff-format.log"

      - name: MyPy core training path
        id: mypy
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: >-
          uv run --locked mypy src/train.py src/eval.py src/data
          src/models/mnist_module.py src/models/components src/utils
          2>&1 | tee "$RUNNER_TEMP/mypy.log"

      - name: Enforce coverage and report four badges
        if: ${{ always() }}
        uses: ./.github/actions/quality-report
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          mypy-outcome: ${{ steps.mypy.outcome }}
          ruff-lint-outcome: ${{ steps.ruff.outcome }}
          ruff-format-outcome: ${{ steps.format.outcome }}

      - name: Upload numeric quality report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-report
          path: ${{ runner.temp }}/quality-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-cpu
          path: |
            coverage.xml
            coverage.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload CPU test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pytest-cpu
          path: ${{ runner.temp }}/pytest-cpu.xml
          retention-days: 7
          if-no-files-found: ignore
