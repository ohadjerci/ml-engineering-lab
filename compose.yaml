services:
  tests:
    image: mlcycle:uv
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile
    gpus: all
    # DataLoader workers and distributed tests need more than Docker's 64 MB default.
    shm_size: "2gb"
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MLFLOW_ALLOW_FILE_STORE: "${MLFLOW_ALLOW_FILE_STORE:-false}"

  train:
    profiles: [training]
    image: mlcycle:uv
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile
    gpus: all
    shm_size: "2gb"
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [default, mlflow]
    volumes:
      - ./logs/train:/workspace/logs/train
      - ./logs/eval:/workspace/logs/eval
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: [uv, run, --locked, python, src/train.py]

  mlflow:
    profiles: [training]
    image: mlcycle:uv
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:50001:5000"
    volumes:
      - ./logs/mlflow:/workspace/logs/mlflow
    networks: [mlflow]
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      - uv
      - run
      - --locked
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////workspace/logs/mlflow/db/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /workspace/logs/mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "mlflow:5000,localhost:*,127.0.0.1:*"

  lock:
    profiles: [tools]
    image: mlcycle:uv-base
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile
      target: uv-base
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
    command: [uv, lock]

networks:
  mlflow:
    name: vision-mlflow
